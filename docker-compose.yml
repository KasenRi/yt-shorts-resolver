services:
  yt-shorts-resolver:
    build: .
    container_name: yt-shorts-resolver
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      RESOLVER_PROVIDER: "${RESOLVER_PROVIDER:-yt-dlp}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      YTDLP_BINARY: "${YTDLP_BINARY:-yt-dlp}"
      YTDLP_PROXY: "${YTDLP_PROXY:-}"
      YTDLP_COOKIES_FILE: "${YTDLP_COOKIES_FILE:-}"
      YTDLP_COOKIES_FROM_BROWSER: "${YTDLP_COOKIES_FROM_BROWSER:-}"
      UPSTREAM_COBALT_BASE_URL: "${UPSTREAM_COBALT_BASE_URL:-}"
      UPSTREAM_COBALT_AUTH_HEADER: "${UPSTREAM_COBALT_AUTH_HEADER:-}"

